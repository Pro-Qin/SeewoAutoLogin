<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seewo Autologin</title>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Seewo Autologin</div>
    <nav>
      <div class="nav-item active" data-page="accounts" onclick="navigate('accounts')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>账号列表</span>
      </div>
      <div class="nav-item" data-page="add" onclick="navigate('add')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>添加账号</span>
      </div>
      <div class="nav-item" data-page="qr" onclick="navigate('qr')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2zm2 10H3v4a2 2 0 0 0 2 2h4v-2H5v-4zm14 4h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zM15 5h4v4h2V5a2 2 0 0 0-2-2h-4v2zM7 8h2v2H7V8zm0 6h2v2H7v-2zm4-6h2v2h-2V8zm0 6h2v2h-2v-2zm4-6h2v2h-2V8zm0 4h2v2h-2v-2zm-8 0h2v2H7v-2z"/></svg>
        <span>扫码登录</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="navigate('settings')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.488.488 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span>设置</span>
      </div>
      <div class="nav-item" data-page="about" onclick="navigate('about')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>关于</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="footer-actions">
        <button class="btn btn-small" onclick="send({type:'restart'})">重启</button>
        <button class="btn btn-small btn-danger" onclick="send({type:'exit'})">退出</button>
      </div>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="accountCountText"></span>
      </div>
      <div class="made-by">Made by Qin_zzq</div>
    </div>
  </aside>
  <main id="main">
    <header id="pageHeader">
      <h1 id="pageTitle">账号列表</h1>
    </header>
    <div id="content">

      <!-- ===== ACCOUNTS PAGE (two-column) ===== -->
      <div id="page-accounts" class="page active">
        <div style="max-width:900px;margin:0 auto">
          <!-- Action Bar -->
          <div class="action-bar">
            <button class="btn btn-secondary action-btn" id="actEditName" disabled onclick="actEditName()">
              <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M15.53 2.47a.75.75 0 0 0-1.06 0l-8.47 8.47-.71 2.83 2.83-.71 8.47-8.47a.75.75 0 0 0 0-1.06l-1.06-1.06zM10.94 5L13 7.06 6.06 14l-.71.71.71-2.83L10.94 5z"/></svg>
              备注
            </button>
            <button class="btn btn-secondary action-btn" id="actEditTags" disabled onclick="actEditTags()">标签</button>
            <button class="btn btn-secondary action-btn" id="actSetActive" disabled onclick="actSetActive()">设为当前</button>
            <button class="btn btn-danger action-btn" id="actDelete" disabled onclick="actDelete()">删除</button>
            <span style="flex:1"></span>
            <button class="btn btn-secondary action-btn" onclick="send({type:'move-up', id:selectedId})" id="actMoveUp" disabled title="上移">
              <svg width="12" height="12" viewBox="0 0 10 10" fill="currentColor"><path d="M2 7l3-3 3 3-1 1-2-2-2 2-1-1z"/></svg>
            </button>
            <button class="btn btn-secondary action-btn" onclick="send({type:'move-down', id:selectedId})" id="actMoveDown" disabled title="下移">
              <svg width="12" height="12" viewBox="0 0 10 10" fill="currentColor"><path d="M8 3l-3 3-3-3 1-1 2 2 2-2 1 1z"/></svg>
            </button>
          </div>
          <!-- Two-Column Layout -->
          <div class="accounts-columns">
            <div class="column active-col">
              <div class="column-header">
                <span>正在生效 <span class="badge-num" id="activeCount">0</span></span>
                <span class="column-sub">展示给希沃 · 最多6个</span>
              </div>
              <div id="activeList" class="column-list"></div>
            </div>
            <div class="column inactive-col">
              <div class="column-header">
                <span>暂未生效 <span class="badge-num" id="inactiveCount">0</span></span>
                <span class="column-sub">右键托盘快速切换</span>
              </div>
              <div id="inactiveList" class="column-list"></div>
            </div>
          </div>
          <div id="emptyState" style="display:none;text-align:center;padding:40px 0">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="#525252"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="empty-text" style="margin-top:10px">暂无账号</div>
          </div>
        </div>
      </div>

      <!-- ===== ADD ACCOUNT PAGE ===== -->
      <div id="page-add" class="page">
        <div style="max-width:400px;margin:0 auto;padding-top:20px">
          <div class="form-group">
            <label>显示名称</label>
            <input type="text" id="displayNameInput" class="input" placeholder="可选">
          </div>
          <div class="form-group">
            <label>手机号 / 用户名</label>
            <input type="text" id="usernameInput" class="input" placeholder="必填">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="passwordInput" class="input" placeholder="必填">
          </div>
          <div id="loginStatus" class="status-msg" style="margin-top:0"></div>
          <button class="btn btn-primary" onclick="handleLogin()" style="width:160px;display:block;margin:0 auto">登录并保存</button>
        </div>
      </div>

      <!-- ===== QR LOGIN PAGE ===== -->
      <div id="page-qr" class="page">
        <div class="card" style="max-width:460px;margin:0 auto;text-align:center">
          <h2 style="font-size:18px;margin:0 0 6px 0">扫码登录</h2>
          <p style="color:#d7d7d7;font-size:12px;margin:0 0 20px 0">使用希沃官方App或微信扫码登录</p>
          <div id="qrContainer" style="display:none">
            <div class="qr-box">
              <img id="qrImage" width="200" height="200" style="display:block">
            </div>
          </div>
          <div id="qrStatus" style="font-size:14px;margin:0 0 12px 0"></div>
          <div id="qrCountdown" style="font-size:12px;color:#525252;margin:0 0 16px 0"></div>
          <div class="btn-row" style="justify-content:center">
            <button id="startQrBtn" class="btn btn-primary" onclick="send({type:'start-qr'})">开始扫码</button>
            <button id="refreshQrBtn" class="btn btn-secondary" style="display:none" onclick="send({type:'start-qr'})">刷新</button>
            <button id="cancelQrBtn" class="btn btn-secondary" style="display:none" onclick="send({type:'cancel-qr'})">取消</button>
          </div>
        </div>
      </div>

      <!-- ===== SETTINGS PAGE ===== -->
      <div id="page-settings" class="page">
        <div class="card">
          <h2 class="card-title">安全设置</h2>
          <label class="checkbox-row">
            <input type="checkbox" id="usePasswordCheck">
            <span>使用密码保护应用设置</span>
          </label>
          <div id="passwordPanel" style="display:none;margin-top:10px">
            <div style="display:flex;gap:8px">
              <input type="password" id="newPasswordInput" class="input" style="width:200px" placeholder="新密码">
              <button class="btn btn-secondary" onclick="setPassword()">设置密码</button>
              <button class="btn btn-secondary" onclick="clearPassword()">清除密码</button>
            </div>
            <div id="passwordStatus" style="font-size:12px;margin-top:8px;color:#d7d7d7"></div>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">用户列表轮换</h2>
          <label class="checkbox-row">
            <input type="checkbox" id="rotationEnabledCheck">
            <span>启用用户列表轮换</span>
          </label>
          <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
            <span style="color:#d7d7d7;font-size:13px">每组用户数：</span>
            <select id="rotationGroupSize" class="input" style="width:80px">
              <option value="4">4</option>
              <option value="6">6</option>
            </select>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">通用设置</h2>
          <label class="checkbox-row">
            <input type="checkbox" id="autoStartCheck">
            <span>开机自启</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="minimizeToTrayCheck">
            <span>关闭时最小化到托盘</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="startMinimizedCheck">
            <span>启动时不显示主界面</span>
          </label>
          <hr class="divider">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn btn-secondary" onclick="send({type:'export-config'})">导出配置</button>
            <button class="btn btn-secondary" onclick="send({type:'import-config'})">导入配置</button>
            <button class="btn btn-secondary" onclick="send({type:'open-log-viewer'})">查看日志</button>
            <button class="btn btn-secondary" onclick="send({type:'open-diagnostic'})">一键诊断</button>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">显示</h2>
          <label class="checkbox-row">
            <input type="checkbox" id="particleToggle" checked>
            <span>粒子背景</span>
          </label>
        </div>
        <div class="card">
          <h2 class="card-title">Debug</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn btn-secondary" onclick="addFakeAccount()">添加假账号</button>
          </div>
          <div id="debugInfo" style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.6">
            <div>希沃状态: <span id="seewoStatus">检测中...</span>
              <button class="btn btn-small" onclick="send({type:'refresh-debug'})" style="margin-left:6px;height:22px;padding:0 6px;font-size:10px">刷新</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== ABOUT PAGE ===== -->
      <div id="page-about" class="page">
        <div class="card" style="max-width:480px;margin:0 auto;min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center">
          <div>
            <h1 class="gradient-title" style="font-size:22px;font-weight:bold;margin:0">Seewo Autologin</h1>
            <p style="color:#d7d7d7;font-size:13px;margin:6px 0 0 0">希沃白板 SSO 快捷登录服务</p>
            <hr class="divider" style="margin:24px 0">
            <p style="font-size:12px;color:#d7d7d7;margin:4px 0">版本: 1.7.8</p>
            <p style="font-size:12px;color:#d7d7d7;margin:4px 0">原作者：CJKmkp</p>
            <p style="font-size:12px;color:#d7d7d7;margin:4px 0">重构作者：Qin_zzq</p>
            <p style="font-size:11px;color:rgba(255,255,255,0.4);margin:2px 0">LLM 辅助编程</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<!-- Lock Overlay -->
<div id="lockOverlay" class="overlay" style="display:none">
  <div class="overlay-box">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#525252"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
    <h2 style="color:#fff;font-size:18px;margin:12px 0 16px 0">请输入密码</h2>
    <input type="password" id="unlockPasswordInput" class="input" style="width:100%;margin-bottom:12px">
    <button class="btn btn-primary" onclick="unlockApp()" style="width:100%">解锁</button>
    <div id="unlockStatus" style="font-size:12px;color:#ff4b4b;margin-top:12px"></div>
  </div>
</div>
</body>
</html>
