name: 错误报告
description: 程序崩溃、界面异常、账号登录失败等「本来能用的功能坏了」
title: "[Bug] "
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前先看一眼 [常见问题](https://github.com/Pro-Qin/SeewoAutoLogin#常见问题) 和程序里的 **疑难解答** 页（左侧栏），
        希沃里看不到快捷登录入口、提示「登录信息过期」这类问题通常在那里就能解决。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么、你预期它应该怎么样。请只描述现象，不用猜原因。
      placeholder: 例如：点「添加账号」用密码登录后，账号卡片立刻变成红色，希沃登录界面点账号提示「登录信息过期」。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出怎么触发。能稳定复现的问题才有得修。
      placeholder: |
        1. 打开程序，进入「添加账号」
        2. 选择手机号 + 密码登录
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常情况下这一步应该看到什么。
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 关于页标题旁的版本号，或日志第一行「[App] 启动 v...」。带小版本号，别只写「最新版」。
      placeholder: 1.14.27
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 系统版本
      options:
        - Windows 11
        - Windows 10 20H1（19041）或更新
        - Windows 10 旧版本
        - Windows 7（应使用 win7 分支的包）
        - Windows Server
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: 用的哪个包
      options:
        - 安装包 SeewoAutoLogin_Setup_vX.Y.Z.exe
        - 离线安装包 SeewoAutoLogin_Setup_vX.Y.Z_WithWebView2.exe
        - 免安装单文件 SeewoAutoLogin.exe
        - 自己编译的
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我看过常见问题与程序内的「疑难解答」页，里面的方法都没解决
          required: true
        - label: 我搜索过现有 issue，没有人报过同样的问题
          required: true
        - label: 我用的是最新版本，不是旧版本残留的问题
          required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        日志窗口右上角「导出日志」得到的文件，或直接粘贴出问题那几分钟的内容。
        **粘贴前请把手机号、学号、姓名打码**，本程序不会上传任何数据，但 issue 是公开的。
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 界面异常、报错弹窗直接截图拖进来。
    validations:
      required: false
