name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (win-x64)
        run: dotnet restore SeewoAutoLogin.csproj -r win-x64

      - name: Publish single-file (win-x64)
        run: dotnet publish SeewoAutoLogin.csproj -c Release -r win-x64 --self-contained false -o bin\Release\net8.0-windows10.0.19041.0\publish --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Chinese language file for Inno Setup
        shell: pwsh
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $dest = Join-Path $langDir "ChineseSimplified.isl"
          if (-not (Test-Path $dest)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $dest
          }

      - name: Sync installer version from csproj
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content SeewoAutoLogin.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "无法从 SeewoAutoLogin.csproj 读取 <Version>" }
          Write-Host "csproj version: $version"
          $iss = Get-Content setup.iss -Raw
          if ($iss -notmatch '#define AppVersion "') { throw "setup.iss 未找到 AppVersion 定义" }
          $updated = $iss -replace '#define AppVersion "[^"]*"', ('#define AppVersion "' + $version + '"')
          Set-Content -Path setup.iss -Value $updated -NoNewline -Encoding UTF8
          Select-String -Path setup.iss -Pattern '#define AppVersion'

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc setup.iss

      - name: Download offline WebView2 runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $out = "publish\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile $out
          Get-Item $out | Select-Object Name, Length

      - name: Build installer with bundled WebView2 (Inno Setup)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DBundleWebView2=1 setup.iss

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length

      # 对「将要上传的 exe」生成校验清单（每行 "<sha256>  <文件名>"），
      # 客户端下载后可用它做强校验（UpdateChecker 读取同 Release 的 SHA256SUMS.txt）
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path publish -Filter 'SeewoAutoLogin_Setup_*.exe' -File
          $single = "bin\Release\net8.0-windows10.0.19041.0\publish\SeewoAutoLogin.exe"
          if (Test-Path $single) { $targets += Get-Item $single }
          if ($targets.Count -eq 0) { throw "没有找到需要计算 SHA256 的发布文件" }

          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            Write-Host "$($file.Name)  $hash"
            "$hash  $($file.Name)"
          }

          # 固定无 BOM 的 UTF-8，避免解析端把 BOM 当成哈希首字符
          $out = Join-Path (Get-Location) "publish\SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines($out, $lines, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "已生成 $out"
          Get-Content $out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/SeewoAutoLogin_Setup_*.exe
            publish/SHA256SUMS.txt
            bin/Release/net8.0-windows10.0.19041.0/publish/SeewoAutoLogin.exe
          generate_release_notes: true
