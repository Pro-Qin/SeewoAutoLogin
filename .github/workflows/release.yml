name: Release

# Windows 7 兼容分支的发版流程。
# 与主干的差别：
#   1) 目标是 net48，产物是「exe + 依赖 DLL」目录（net48 没有单文件发布），
#      所以免安装版是一个 zip，而不是单个 exe；
#   2) 安装包带 _Win7 后缀，与主干安装包在同一个 Release 里不会撞名；
#   3) 不自动下载 WebView2 最新版 —— Win7 只能用 109.0.1518.78，
#      发布前人工把它放到 publish\MicrosoftEdgeWebView2RuntimeInstallerX64.exe，
#      没放就只出轻量安装包（绝不会把不支持的版本塞进内置包）。
# Win7 分支的 tag 建议用 vX.Y.Z-win7，避免与主干的 vX.Y.Z 指向同一个 tag 名。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SeewoAutoLogin.csproj

      - name: Test
        run: dotnet test tests\SeewoAutoLogin.Tests\SeewoAutoLogin.Tests.csproj -c Release

      - name: Publish (net48, 非单文件)
        run: dotnet publish SeewoAutoLogin.csproj -c Release -o bin\Release\net48\publish --no-restore

      - name: 校验 x64 产物
        shell: pwsh
        run: |
          foreach ($f in @('bin\Release\net48\publish\SeewoAutoLogin.exe', 'bin\Release\net48\publish\WebView2Loader.dll')) {
            if (-not (Test-Path $f)) { throw "缺少产物 $f" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw "$f 不是 x64（Machine=0x$($machine.ToString('X4'))）" }
          }
          Write-Host "x64 校验通过"

      # 免安装版：net48 不是单文件，必须把整个目录打成 zip，
      # 只发一个 exe 用户下载下来会缺依赖 DLL 打不开。
      - name: 打包免安装版
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content SeewoAutoLogin.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "无法从 SeewoAutoLogin.csproj 读取 <Version>" }
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $zip = "publish\SeewoAutoLogin_v${version}_Win7_Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "bin\Release\net48\publish\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      # 可选：对主 exe 做 Authenticode 签名。未配置 secrets 时自动跳过。
      - name: Sign exe (optional)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Warning "未配置 SIGNING_PFX_BASE64，跳过 Authenticode 签名。"
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "找不到 signtool.exe" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $target = "bin\Release\net48\publish\SeewoAutoLogin.exe"
          & $signtool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
          if ($LASTEXITCODE -ne 0) { throw "signtool 签名失败：$LASTEXITCODE" }
          & $signtool verify /pa /v $target

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Chinese language file for Inno Setup
        shell: pwsh
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $dest = Join-Path $langDir "ChineseSimplified.isl"
          if (-not (Test-Path $dest)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $dest
          }

      - name: Sync installer version from csproj
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content SeewoAutoLogin.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "无法从 SeewoAutoLogin.csproj 读取 <Version>" }
          Write-Host "csproj version: $version"
          $iss = Get-Content setup.iss -Raw
          if ($iss -notmatch '#define AppVersion "') { throw "setup.iss 未找到 AppVersion 定义" }
          $updated = $iss -replace '#define AppVersion "[^"]*"', ('#define AppVersion "' + $version + '"')
          Set-Content -Path setup.iss -Value $updated -NoNewline -Encoding UTF8
          Select-String -Path setup.iss -Pattern '#define AppVersion'

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc setup.iss

      # 内置 WebView2 版：只有仓库里已备好 109 的离线安装器时才打包。
      # 刻意不自动下载 —— go.microsoft.com 的那些链接给的都是最新 Evergreen 版本，
      # 在 Windows 7 上装完也起不来。
      - name: Build installer with bundled WebView2 (Inno Setup, optional)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          $runtimeInstaller = "publish\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          if (-not (Test-Path $runtimeInstaller)) {
            Write-Warning "未找到 $runtimeInstaller；跳过内置 WebView2 版安装包（Win7 上必须使用 109.0.1518.78）"
            exit 0
          }
          Get-Item $runtimeInstaller | Select-Object Name, Length
          iscc /DBundleWebView2=1 setup.iss

      # 可选：对安装包做 Authenticode 签名。必须在生成 SHA256SUMS.txt 之前完成。
      - name: Sign installers (optional)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Warning "未配置 SIGNING_PFX_BASE64，跳过安装包签名。"
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "找不到 signtool.exe" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $targets = Get-ChildItem -Path publish -Filter 'SeewoAutoLogin_Setup_*.exe' -File
          if ($targets.Count -eq 0) { throw "publish 目录中没有找到安装包" }
          foreach ($t in $targets) {
            & $signtool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool 签名失败：$($t.Name) $LASTEXITCODE" }
            & $signtool verify /pa /v $t.FullName
          }

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length

      # 对「将要上传的文件」生成校验清单（每行 "<sha256>  <文件名>"），
      # 客户端下载后可用它做强校验（UpdateChecker 读取同 Release 的 SHA256SUMS.txt）。
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path publish -Filter 'SeewoAutoLogin_Setup_*.exe' -File
          $targets += Get-ChildItem -Path publish -Filter 'SeewoAutoLogin_v*_Win7_Portable.zip' -File
          if ($targets.Count -eq 0) { throw "没有找到需要计算 SHA256 的发布文件" }

          $lines = foreach ($file in $targets) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            Write-Host "$($file.Name)  $hash"
            "$hash  $($file.Name)"
          }

          # 固定无 BOM 的 UTF-8，避免解析端把 BOM 当成哈希首字符
          $out = Join-Path (Get-Location) "publish\SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines($out, $lines, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "已生成 $out"
          Get-Content $out

      # 生成发布说明：固定开头（产物怎么选）＋ CHANGELOG 里对应版本的段落。
      - name: Build release body
        shell: pwsh
        run: ./.github/scripts/build-release-body.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            publish/SeewoAutoLogin_Setup_*.exe
            publish/SeewoAutoLogin_v*_Win7_Portable.zip
            publish/SHA256SUMS.txt
          body_path: RELEASE_BODY.md
